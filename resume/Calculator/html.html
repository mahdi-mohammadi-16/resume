<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title> 

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">



    <link rel="stylesheet" href="./css.css">
</head>
<body>
    <div class="container">
        <div class="input-section">
            <input type="text" class="input" value="">
        </div>
        <div class="button">
            <ul>
                <li id="clean"><img src="./img/icons8-c-24.png" alt=""></li>
                <li id="back"><img src="./img/Price Tag with _X_ Icon.png" alt="" style="width: 50px;"></li>
                <li  id="/" ><img src="./img/icons8-divide-24.png" alt=""></li>
                <li  id="*" ><img src="./img/icons8-multiply-24.png" alt=""></li>
                <li  id="7" onclick="gg('7')">7</li>
                <li  id="8" onclick="gg('8')">8</li>
                <li  id="9" onclick="gg('9')">9</li>
                <li  id="-" ><img src="./img/icons8-minus-24.png" alt=""></li>
                <li  id="4" onclick="gg('4')">4</li>
                <li  id="5" onclick="gg('5')">5</li>
                <li  id="6" onclick="gg('6')">6</li>
                <li  id="+" ><img src="./img/icons8-plus-24.png" alt=""></li>
                <li  id="1" onclick="gg('1')">1</li>
                <li  id="2" onclick="gg('2')">2</li>
                <li  id="3" onclick="gg('3')">3</li>
                <li style="background-color: white;"></li>
                <li >%</li>
                <li  id="0" onclick="gg('0')">0</li>
                <li id="point"><img src="./img/icons8-dot-24.png" alt=""></li>
                <li style="background-color: white;"></li>
                <li  id="equal" ><img src="./img/icons8-equal-sign-26.png" alt=""></li>

            </ul>
        </div>
    </div>
    <script src="./js.js" defer></script>
</body> 
</html>
